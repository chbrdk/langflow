# The live instance is built by Coolify from Dockerfile.projects-a.
# ghcr.io/chbrdk/langflow stays private, so this workflow is manual only.

name: projects-a image

on:
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.projects-a
          push: true
          tags: ghcr.io/chbrdk/langflow:projects-a
